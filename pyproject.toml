[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-design-grafos"
version = "0.1.0"
description = "Contract-first graph integration foundation for immutable clinical guideline sources"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "NetworkX>=3.4",
  "SciPy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["integration_design_grafos*"]
