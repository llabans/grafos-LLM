[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bipartite-minsa"
version = "0.1.0"
description = "Emparejamiento bipartito auditable para cobertura educativa de datos estructurados de una GPC MINSA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daco" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "networkx>=3.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "reportlab>=4.0",
  "ruff>=0.5",
]

[project.scripts]
bipartite-minsa = "bipartite_minsa.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "source: requires the private local GPC snapshot",
]
